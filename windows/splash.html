<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HERMES AGENT OS — Bootloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #03060c;
      color: #00f2fe;
      font-family: 'Consolas', 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    /* Scanlines */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }
    /* Glowing vignette */
    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 11;
    }
    .hud-container {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
      max-width: 600px;
    }
    /* Arc Reactor Ring */
    .reactor {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 30px;
    }
    .ring-outer {
      position: absolute;
      inset: 0;
      border: 2px dashed #00f2fe;
      border-radius: 50%;
      animation: spin 16s linear infinite;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
    }
    .ring-inner {
      position: absolute;
      inset: 15px;
      border: 2px solid rgba(0, 242, 254, 0.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin-reverse 8s linear infinite;
    }
    .core {
      position: absolute;
      inset: 38px;
      background: radial-gradient(circle, #00f2fe 0%, #032b44 70%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #00f2fe;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 45px #00f2fe; }
    }
    .title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 15px #00f2fe;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(0, 242, 254, 0.7);
      margin-bottom: 24px;
    }
    /* Progress bar */
    .progress-box {
      width: 100%;
      height: 6px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      box-shadow: 0 0 12px #00f2fe;
      transition: width 0.4s ease;
      animation: shimmer 1.5s infinite;
    }
    .status-text {
      font-size: 11px;
      letter-spacing: 2px;
      color: #9ee6ff;
      height: 20px;
    }
    .checklist {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      width: 100%;
      text-align: left;
      background: rgba(0, 242, 254, 0.03);
      border: 1px solid rgba(0, 242, 254, 0.12);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .check-ok {
      color: #10b981;
      font-weight: bold;
    }
    .check-pending {
      color: #eab308;
    }
  </style>
</head>
<body>
  <div class="hud-container">
    <div class="reactor">
      <div class="ring-outer"></div>
      <div class="ring-inner"></div>
      <div class="core"></div>
    </div>

    <div class="title">HERMES AGENT OS</div>
    <div class="subtitle">AUTONOMOUS DESKTOP RUNTIME ⋄ KALI LINUX SUBSYSTEM</div>

    <div class="progress-box">
      <div id="pBar" class="progress-bar"></div>
    </div>

    <div id="statusText" class="status-text">INITIALIZING SUBSYSTEM MATRIX...</div>

    <div class="checklist">
      <div class="check-item"><span id="c1" class="check-pending">●</span> <span>WSL2 KALI LINUX ENVIRONMENT</span></div>
      <div class="check-item"><span id="c2" class="check-pending">●</span> <span>HERMES DAEMONS (STUDIO :3001, CESIUM :4173)</span></div>
      <div class="check-item"><span id="c3" class="check-pending">●</span> <span>KALI SUBSYSTEM PERSISTENCE & RUNTIME</span></div>
      <div class="check-item"><span id="c4" class="check-pending">●</span> <span>ENGAGING J.A.R.V.I.S. NEURAL COCKPIT</span></div>
    </div>
  </div>

  <script>
    window.updateBootProgress = function(step, text) {
      const pBar = document.getElementById('pBar');
      const sText = document.getElementById('statusText');
      if (sText && text) sText.innerText = text;

      if (step >= 1) {
        const c1 = document.getElementById('c1');
        if (c1) { c1.innerText = '✔'; c1.className = 'check-ok'; }
      }
      if (step >= 2) {
        const c2 = document.getElementById('c2');
        if (c2) { c2.innerText = '✔'; c2.className = 'check-ok'; }
      }
      if (step >= 3) {
        const c3 = document.getElementById('c3');
        if (c3) { c3.innerText = '✔'; c3.className = 'check-ok'; }
      }
      if (step >= 4) {
        const c4 = document.getElementById('c4');
        if (c4) { c4.innerText = '✔'; c4.className = 'check-ok'; }
      }

      if (pBar) {
        pBar.style.width = step === 1 ? '30%' : step === 2 ? '65%' : step === 3 ? '85%' : '100%';
      }
    };
  </script>
</body>
</html>
